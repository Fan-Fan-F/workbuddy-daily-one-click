name: Offline deployment state tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  state:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    env:
      REQUIRE_GIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test selected state helpers and disposable Git fixtures
        run: python -B -S -m unittest discover -s tests -v
